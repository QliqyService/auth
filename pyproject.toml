[project]
name = "qliqy-auth"
version = "0.1.0"
description = "Qliqy | Auth Services"
authors = [{ name = "Ernestor1337", email = "berezin.505@gmail.com" },{ name = "ilia2003", email= "fedorenkoilia@gmail.com"},{ name = "Jeishod", email = "jeishod@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.17.1",
    "asyncpg==0.30.0",
    "fastapi-users[sqlalchemy]==15.0.1",
    "faststream[rabbit]==0.6.3",
    "gunicorn==23.0.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "orjson==3.11.4",
    "poethepoet==0.37.0",
    "psycopg2-binary==2.9.11",
    "pydantic-settings==2.11.0",
    "redis==7.0.1",
    "sqladmin==0.21.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "ruff==0.14.3",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "PLR0911", "PLR0912", "PLR0915", "PLR0913", "PLW2901"]
select = [
    # flake8-bugbear
    "B",
    # pycodestyle
    "E",
    "W",
    "FAST",
    # pylint
    "PL",
    # pyflakes
    "F",
    # isort
    "I",
    # pydocstyle
#    "D",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.poe]
envfile = [".env"]
verbosity = 1

[tool.poe.executor]
type = "virtualenv"
location = ".venv"

# formatting
[tool.poe.tasks.ruff-lint]
shell = "uv run ruff check --fix app dev"
[tool.poe.tasks.ruff-format]
shell = "uv run ruff format app dev"
[tool.poe.tasks.format]
sequence = [
    {ref = "ruff-lint"},
    {ref = "ruff-format"},
]

[tool.poe.tasks.create-migration]
# Создать миграцю
cmd = "alembic revision --autogenerate -m \"${message}\""
args = { message = { options = ["-m"], default = "autogenerated_migration" }}

[tool.poe.tasks.apply-migrations]
# Применить миграции
cmd = "alembic upgrade head"

[tool.poe.tasks.dev]
# Старт сервера в дев-режиме
cmd = "uvicorn --reload --use-colors --host 0.0.0.0 --port \"${port}\" --log-level debug 'app.main:app'"
args = { port = { options = ["-p"], default = "8000" }}

[tool.poe.tasks.init-db]
# Инициализация базы данных
script = "dev.init_database:main()"
[tool.poe.tasks.load-fixtures]
# Загрузка фикстур
script = "dev.load_fixtures:main()"

[tool.poe.tasks.prod]
# Старт сервера в прод-режиме
cmd = "gunicorn -c app/gunicorn_conf.py app.main:app"

[tool.poe.tasks.start-prod]
sequence = [
    {ref = "apply-migrations"},
    {ref = "prod"}
]
